<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Karina</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230A0A0A'/%3E%3Cpath d='M11 7v18M22 7 11 17M15 13.5 23 25' fill='none' stroke='%23FAF9F6' stroke-width='3'/%3E%3C/svg%3E">
  <meta name="description" content="Get in touch with Karina, a wedding photographer capturing love stories in black and white.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Pinyon+Script&family=Playfair+Display&display=swap" rel="stylesheet">
  <script>document.documentElement.classList.add('js');</script>
  <style>
    :root {
      --black: #0A0A0A;
      --white: #FAF9F6;
      --gold: #D4AF37;
      --font-display: "Playfair Display", Georgia, serif;
      --font-script: "Pinyon Script", "Snell Roundhand", Georgia, serif;
      --font-body: "Lato", Arial, sans-serif;
      --gutter: clamp(20px, 6vw, 96px);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background: var(--black);
      color: var(--white);
      font-family: var(--font-body);
      font-size: 1.125rem;
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 1px solid var(--gold);
      outline-offset: 4px;
    }

    /* Navigation */
    .nav {
      padding: clamp(24px, 4vw, 48px) var(--gutter);
    }

    .nav ul {
      display: flex;
      justify-content: flex-end;
      gap: clamp(20px, 4vw, 48px);
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .nav a {
      display: inline-block;
      padding: 8px 0;
      font-size: 0.875rem;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-underline-offset: 6px;
    }

    .nav a:hover,
    .nav a[aria-current="page"] {
      color: var(--gold);
      text-decoration: underline;
      text-decoration-thickness: 1px;
    }

    /* Mobile menu */
    .nav-toggle,
    .nav-close {
      display: none;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 0;
      background: none;
      color: var(--white);
      cursor: pointer;
    }

    @media (hover: hover) {
      .nav-toggle:hover,
      .nav-close:hover {
        color: var(--gold);
      }
    }

    .nav-toggle svg,
    .nav-close svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
    }

    .nav-menu {
      display: block;
      position: static;
      width: auto;
      max-width: none;
      height: auto;
      max-height: none;
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
    }

    @media (max-width: 760px) {
      body:has(.nav-menu[open]) {
        overflow: hidden;
      }

      .nav-toggle,
      .nav-close {
        display: grid;
      }

      .nav-toggle {
        margin-left: auto;
      }

      .nav-menu {
        display: none;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: var(--black);
        transform: translateX(100%);
      }

      .nav-menu[open] {
        display: flex;
      }

      .nav-menu.is-visible {
        transform: none;
      }

      .nav-menu::backdrop {
        background: transparent;
      }

      .nav-close {
        position: absolute;
        top: clamp(24px, 4vw, 48px);
        right: var(--gutter);
      }

      .nav-menu ul {
        flex-direction: column;
        align-items: center;
        gap: clamp(16px, 4vh, 32px);
        margin: auto;
      }

      .nav-menu a {
        font-family: var(--font-display);
        font-size: 2rem;
        letter-spacing: 0;
        line-height: 1.3;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .nav-menu {
        transition: transform 0.45s ease-out;
      }
    }

    /* Page layout */
    .contact {
      max-width: 40rem;
      margin: 0 auto;
      padding: clamp(72px, 11vw, 160px) var(--gutter) clamp(112px, 16vw, 224px);
      text-align: center;
    }

    .contact h1 {
      margin: 0;
      color: var(--gold);
      font-family: var(--font-display);
      font-size: clamp(3.5rem, 11vw, 6rem);
      font-weight: 400;
      line-height: 1;
    }

    .contact-intro {
      margin: 0.25em 0 0;
      color: var(--gold);
      font-family: var(--font-script);
      font-size: clamp(1.75rem, 5vw, 2.75rem);
      line-height: 1.2;
    }

    /* Form */
    .contact-form {
      margin-top: clamp(64px, 10vw, 120px);
    }

    .field {
      margin-bottom: clamp(36px, 5vw, 56px);
    }

    .field label {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .field input,
    .field textarea {
      display: block;
      width: 100%;
      padding: 12px 0;
      border: 0;
      border-bottom: 1px solid var(--white);
      border-radius: 0;
      outline: 0;
      background: transparent;
      color: var(--white);
      caret-color: var(--white);
      font: inherit;
      appearance: none;
    }

    .field textarea {
      min-height: 9rem;
      resize: vertical;
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: var(--white);
      opacity: 0.5;
    }

    .field input:focus,
    .field textarea:focus {
      border-bottom-color: var(--gold);
      box-shadow: 0 1px 0 var(--gold);
    }

    /* Keep browser autofill from tinting the fields */
    .field input:-webkit-autofill {
      -webkit-text-fill-color: var(--white);
      -webkit-box-shadow: 0 0 0 100px var(--black) inset;
      caret-color: var(--white);
    }

    .submit-button {
      margin-top: 8px;
      padding: 16px 48px;
      border: 1px solid var(--gold);
      border-radius: 0;
      background: var(--gold);
      color: var(--black);
      font: inherit;
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
    }

    .submit-button:hover {
      background: var(--black);
      color: var(--gold);
    }

    /* Thank-you message */
    .form-status {
      margin: clamp(64px, 10vw, 120px) 0 0;
      font-size: 1.25rem;
      outline: 0;
    }

    .form-status:empty {
      display: none;
    }

    /* Instagram */
    .instagram {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: clamp(64px, 9vw, 104px);
      padding: 8px 0;
      font-size: 0.875rem;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-underline-offset: 6px;
    }

    .instagram:hover {
      text-decoration: underline;
      text-decoration-thickness: 1px;
    }

    .instagram svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
    }

    /* Back to top */
    .to-top {
      position: fixed;
      right: clamp(16px, 3vw, 32px);
      bottom: clamp(16px, 3vw, 32px);
      z-index: 10;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: var(--white);
      box-shadow: 0 2px 12px rgba(10, 10, 10, 0.4);
      color: var(--black);
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
    }

    .to-top.is-visible {
      opacity: 1;
      visibility: visible;
    }

    .to-top svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
    }

    @media (hover: hover) {
      .to-top:hover {
        background: var(--gold);
        transform: translateY(-2px);
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .to-top {
        transition: opacity 0.4s ease-out, visibility 0.4s, background-color 0.2s, transform 0.2s;
      }
    }

    /* Entrance animations */
    @media screen and (prefers-reduced-motion: no-preference) {
      .js .reveal {
        opacity: 0;
        transition: opacity 1s ease-out;
      }

      .js .reveal.is-visible {
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .submit-button {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <nav class="nav" aria-label="Main">
      <button class="nav-toggle" type="button" aria-label="Open menu" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <dialog class="nav-menu" aria-label="Menu">
        <button class="nav-close" type="button" aria-label="Close menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </dialog>
    </nav>
  </header>

  <main class="contact">
    <h1 class="reveal">Contact</h1>
    <p class="contact-intro reveal">Tell me about your day</p>

    <!-- Demo only: nothing is sent. Connect a form service before publishing. -->
    <form class="contact-form">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" placeholder="Name" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="Email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Message" required></textarea>
      </div>
      <button class="submit-button" type="submit">Send</button>
    </form>

    <p class="form-status" role="status" tabindex="-1" lang="et"></p>

    <!-- Placeholder: replace href with Karina's Instagram profile. -->
    <a class="instagram" href="https://www.instagram.com/">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.25" cy="6.75" r="0.5"/>
      </svg>
      Instagram
    </a>
  </main>

  <button class="to-top" type="button" aria-label="Back to top">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

  <script>
    // Fade headings in as they scroll into view
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (!entry.isIntersecting) return;
        entry.target.classList.add('is-visible');
        revealObserver.unobserve(entry.target);
      });
    }, { threshold: 0.2, rootMargin: '0px 0px -10% 0px' });

    document.querySelectorAll('.reveal').forEach((heading) => revealObserver.observe(heading));

    // Mobile menu: slides in over the page
    const navMenu = document.querySelector('.nav-menu');
    const navSlideMs = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 450;

    function closeNavMenu() {
      navMenu.classList.remove('is-visible');
      setTimeout(() => navMenu.close(), navSlideMs);
    }

    document.querySelector('.nav-toggle').addEventListener('click', () => {
      navMenu.showModal();
      void navMenu.offsetHeight; // Commit the off-screen state so the slide runs
      navMenu.classList.add('is-visible');
    });

    navMenu.querySelector('.nav-close').addEventListener('click', closeNavMenu);
    navMenu.querySelectorAll('a').forEach((link) => link.addEventListener('click', closeNavMenu));

    // Esc: slide out first instead of closing instantly
    navMenu.addEventListener('cancel', (event) => {
      event.preventDefault();
      closeNavMenu();
    });

    navMenu.addEventListener('close', () => navMenu.classList.remove('is-visible'));

    // Rotating or resizing past the breakpoint leaves no overlay behind
    matchMedia('(max-width: 760px)').addEventListener('change', () => {
      if (navMenu.open) navMenu.close();
    });

    // Show the back-to-top button after scrolling down 400px
    const toTop = document.querySelector('.to-top');
    const updateToTop = () => toTop.classList.toggle('is-visible', window.scrollY > 400);

    window.addEventListener('scroll', updateToTop, { passive: true });
    updateToTop();

    toTop.addEventListener('click', () => {
      const smooth = matchMedia('(prefers-reduced-motion: no-preference)').matches;
      window.scrollTo({ top: 0, behavior: smooth ? 'smooth' : 'auto' });
      document.querySelector('.nav a').focus({ preventScroll: true }); // The button is about to hide
    });

    const form = document.querySelector('.contact-form');
    const status = document.querySelector('.form-status');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      form.hidden = true;
      status.textContent = 'Aitäh. Võtan sinuga peagi ühendust.';
      status.focus();
    });
  </script>
</body>
</html>
