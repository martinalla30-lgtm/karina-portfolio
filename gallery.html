<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery — Karina</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230A0A0A'/%3E%3Cpath d='M11 7v18M22 7 11 17M15 13.5 23 25' fill='none' stroke='%23FAF9F6' stroke-width='3'/%3E%3C/svg%3E">
  <meta name="description" content="A gallery of wedding photography by Karina, in black and white.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Pinyon+Script&family=Playfair+Display&display=swap" rel="stylesheet">
  <script>document.documentElement.classList.add('js');</script>
  <style>
    :root {
      --black: #0A0A0A;
      --white: #FAF9F6;
      --gold: #D4AF37;
      --font-display: "Playfair Display", Georgia, serif;
      --font-script: "Pinyon Script", "Snell Roundhand", Georgia, serif;
      --font-body: "Lato", Arial, sans-serif;
      --gutter: clamp(20px, 6vw, 96px);
      --gap: clamp(12px, 2.5vw, 32px);
      --fade: 0.3s;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background: var(--black);
      color: var(--white);
      font-family: var(--font-body);
      font-size: 1.125rem;
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
    }

    body:has(.lightbox[open]) {
      overflow: hidden;
    }

    a {
      color: inherit;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 1px solid var(--gold);
      outline-offset: 4px;
    }

    /* Navigation */
    .nav {
      padding: clamp(24px, 4vw, 48px) var(--gutter);
    }

    .nav ul {
      display: flex;
      justify-content: flex-end;
      gap: clamp(20px, 4vw, 48px);
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .nav a {
      display: inline-block;
      padding: 8px 0;
      font-size: 0.875rem;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-underline-offset: 6px;
    }

    .nav a:hover,
    .nav a[aria-current="page"] {
      color: var(--gold);
      text-decoration: underline;
      text-decoration-thickness: 1px;
    }

    /* Mobile menu */
    .nav-toggle,
    .nav-close {
      display: none;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 0;
      background: none;
      color: var(--white);
      cursor: pointer;
    }

    @media (hover: hover) {
      .nav-toggle:hover,
      .nav-close:hover {
        color: var(--gold);
      }
    }

    .nav-toggle svg,
    .nav-close svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
    }

    .nav-menu {
      display: block;
      position: static;
      width: auto;
      max-width: none;
      height: auto;
      max-height: none;
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
    }

    @media (max-width: 760px) {
      body:has(.nav-menu[open]) {
        overflow: hidden;
      }

      .nav-toggle,
      .nav-close {
        display: grid;
      }

      .nav-toggle {
        margin-left: auto;
      }

      .nav-menu {
        display: none;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: var(--black);
        transform: translateX(100%);
      }

      .nav-menu[open] {
        display: flex;
      }

      .nav-menu.is-visible {
        transform: none;
      }

      .nav-menu::backdrop {
        background: transparent;
      }

      .nav-close {
        position: absolute;
        top: clamp(24px, 4vw, 48px);
        right: var(--gutter);
      }

      .nav-menu ul {
        flex-direction: column;
        align-items: center;
        gap: clamp(16px, 4vh, 32px);
        margin: auto;
      }

      .nav-menu a {
        font-family: var(--font-display);
        font-size: 2rem;
        letter-spacing: 0;
        line-height: 1.3;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .nav-menu {
        transition: transform 0.45s ease-out;
      }
    }

    /* Page heading */
    .page-heading {
      padding: clamp(56px, 9vw, 120px) var(--gutter) clamp(72px, 11vw, 144px);
      text-align: center;
    }

    .page-heading h1 {
      margin: 0;
      color: var(--gold);
      font-family: var(--font-display);
      font-size: clamp(3.5rem, 11vw, 7rem);
      font-weight: 400;
      line-height: 1;
    }

    .page-heading p {
      margin: 0.25em 0 0;
      color: var(--gold);
      font-family: var(--font-script);
      font-size: clamp(1.75rem, 5vw, 3rem);
      line-height: 1.2;
    }

    /* Masonry grid */
    .gallery {
      columns: 3;
      column-gap: var(--gap);
      max-width: 1360px;
      margin: 0 auto;
      padding: 0 var(--gutter) clamp(96px, 14vw, 192px);
    }

    .gallery a {
      display: block;
      margin-bottom: var(--gap);
      break-inside: avoid;
    }

    .gallery img {
      display: block;
      width: 100%;
      height: auto;
      filter: grayscale(100%);
      transition: opacity var(--fade);
    }

    .gallery a:hover img {
      opacity: 0.75;
    }

    .gallery img.is-loading {
      opacity: 0;
    }

    /* Lightbox */
    .lightbox {
      width: 100%;
      max-width: none;
      height: 100%;
      max-height: none;
      margin: 0;
      padding: clamp(8px, 2vw, 24px);
      border: 0;
      background: rgba(10, 10, 10, 0.95);
      color: var(--white);
      opacity: 0;
      transition: opacity var(--fade);
    }

    .lightbox[open] {
      display: grid;
      grid-template:
        ".    .     close" auto
        "prev image next" minmax(0, 1fr)
        ".    count ." auto
        / auto minmax(0, 1fr) auto;
      gap: 8px;
    }

    .lightbox.is-visible {
      opacity: 1;
    }

    .lightbox::backdrop {
      background: transparent;
    }

    .lightbox-image {
      grid-area: image;
      place-self: center;
      min-width: 0;
      max-width: 100%;
      min-height: 0;
      max-height: 100%;
      filter: grayscale(100%);
      opacity: 0;
      transition: opacity var(--fade);
    }

    .lightbox-image.is-visible {
      opacity: 1;
    }

    .lightbox-button {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      padding: 0;
      border: 0;
      background: none;
      color: var(--gold);
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .lightbox-button:hover {
      opacity: 0.6;
    }

    .lightbox-button svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
    }

    .lightbox-close {
      grid-area: close;
    }

    .lightbox-prev {
      grid-area: prev;
      align-self: center;
    }

    .lightbox-next {
      grid-area: next;
      align-self: center;
    }

    .lightbox-count {
      grid-area: count;
      align-self: center;
      font-size: 0.875rem;
      letter-spacing: 0.08em;
      text-align: center;
    }

    @media (max-width: 900px) {
      .gallery {
        columns: 2;
      }
    }

    @media (max-width: 700px) {
      .lightbox[open] {
        grid-template:
          ".    .     close" auto
          "image image image" minmax(0, 1fr)
          "prev count next" auto
          / auto minmax(0, 1fr) auto;
      }
    }

    /* Back to top */
    .to-top {
      position: fixed;
      right: clamp(16px, 3vw, 32px);
      bottom: clamp(16px, 3vw, 32px);
      z-index: 10;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: var(--white);
      box-shadow: 0 2px 12px rgba(10, 10, 10, 0.4);
      color: var(--black);
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
    }

    .to-top.is-visible {
      opacity: 1;
      visibility: visible;
    }

    .to-top svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
    }

    @media (hover: hover) {
      .to-top:hover {
        background: var(--gold);
        transform: translateY(-2px);
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .to-top {
        transition: opacity 0.4s ease-out, visibility 0.4s, background-color 0.2s, transform 0.2s;
      }
    }

    /* Entrance animations */
    @media screen and (prefers-reduced-motion: no-preference) {
      .js .reveal {
        opacity: 0;
        transition: opacity 1s ease-out;
      }

      .js .reveal.is-visible {
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      :root {
        --fade: 0s;
      }
    }
  </style>
</head>
<body>
  <header>
    <nav class="nav" aria-label="Main">
      <button class="nav-toggle" type="button" aria-label="Open menu" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <dialog class="nav-menu" aria-label="Menu">
        <button class="nav-close" type="button" aria-label="Close menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="gallery.html" aria-current="page">Gallery</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
      </dialog>
    </nav>
  </header>

  <main>
    <div class="page-heading reveal">
      <h1>Gallery</h1>
      <p>Capturing Love Stories</p>
    </div>

    <!-- Stock photos from Unsplash: replace each href (large) and src (thumbnail) with a real photo. -->
    <section class="gallery" aria-label="Photos">
      <a href="https://images.unsplash.com/photo-1583939003579-730e3918a45a?auto=format&w=1400&q=80"><img src="https://images.unsplash.com/photo-1583939003579-730e3918a45a?auto=format&w=600&q=75" width="600" height="900" loading="lazy" alt="Newlyweds kissing as guests throw petals over them"></a>
      <a href="https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?auto=format&w=1800&q=80"><img src="https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?auto=format&w=600&q=75" width="600" height="400" loading="lazy" alt="Bride and groom resting their hands together, showing their rings, beside a bouquet"></a>
      <a href="https://images.unsplash.com/photo-1544078751-58fee2d8a03b?auto=format&w=1800&q=80"><img src="https://images.unsplash.com/photo-1544078751-58fee2d8a03b?auto=format&w=600&q=75" width="600" height="400" loading="lazy" alt="Couple embracing on a dark sand beach with sea stacks behind them"></a>
      <a href="https://images.unsplash.com/photo-1525258946800-98cfd641d0de?auto=format&w=1400&q=80"><img src="https://images.unsplash.com/photo-1525258946800-98cfd641d0de?auto=format&w=600&q=75" width="600" height="900" loading="lazy" alt="Bride holding a bouquet of roses in front of her dress"></a>
      <a href="https://images.unsplash.com/photo-1469371670807-013ccf25f16a?auto=format&w=1800&q=80"><img src="https://images.unsplash.com/photo-1469371670807-013ccf25f16a?auto=format&w=600&q=75" width="600" height="400" loading="lazy" alt="Ceremony aisle lined with flower arrangements and chairs, leading to an arch"></a>
      <a href="https://images.unsplash.com/photo-1537633552985-df8429e8048b?auto=format&w=1400&q=80"><img src="https://images.unsplash.com/photo-1537633552985-df8429e8048b?auto=format&w=600&q=75" width="600" height="900" loading="lazy" alt="Bride and groom embracing on a beach, her long veil spread over the stones"></a>
      <a href="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&w=1800&q=80"><img src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&w=600&q=75" width="600" height="400" loading="lazy" alt="Couple standing close in warm backlight, the bride holding a bouquet"></a>
      <a href="https://images.unsplash.com/photo-1529636798458-92182e662485?auto=format&w=1800&q=80"><img src="https://images.unsplash.com/photo-1529636798458-92182e662485?auto=format&w=600&q=75" width="600" height="401" loading="lazy" alt="Wooden ceremony arch decorated with flowers and draped fabric"></a>
      <a href="https://images.unsplash.com/photo-1523438885200-e635ba2c371e?auto=format&w=1400&q=80"><img src="https://images.unsplash.com/photo-1523438885200-e635ba2c371e?auto=format&w=600&q=75" width="600" height="900" loading="lazy" alt="Domed garden pavilion decorated for a ceremony, with chairs on either side of the aisle"></a>
      <a href="https://images.unsplash.com/photo-1532712938310-34cb3982ef74?auto=format&w=1800&q=80"><img src="https://images.unsplash.com/photo-1532712938310-34cb3982ef74?auto=format&w=600&q=75" width="600" height="400" loading="lazy" alt="Couple walking hand in hand across open hills under a wide sky"></a>
      <a href="https://images.unsplash.com/photo-1520854221256-17451cc331bf?auto=format&w=1800&q=80"><img src="https://images.unsplash.com/photo-1520854221256-17451cc331bf?auto=format&w=600&q=75" width="600" height="400" loading="lazy" alt="Bride and groom holding hands, their shadows falling on the grass"></a>
      <a href="https://images.unsplash.com/photo-1591604466107-ec97de577aff?auto=format&w=1800&q=80"><img src="https://images.unsplash.com/photo-1591604466107-ec97de577aff?auto=format&w=600&q=75" width="600" height="400" loading="lazy" alt="Bride and groom smiling together beside a lake"></a>
    </section>
  </main>

  <button class="to-top" type="button" aria-label="Back to top">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

  <dialog class="lightbox" aria-label="Photo viewer">
    <button class="lightbox-button lightbox-close" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
    <button class="lightbox-button lightbox-prev" type="button" aria-label="Previous photo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l-8 8 8 8"/></svg>
    </button>
    <img class="lightbox-image" alt="">
    <button class="lightbox-button lightbox-next" type="button" aria-label="Next photo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8"/></svg>
    </button>
    <p class="lightbox-count" aria-live="polite"></p>
  </dialog>

  <script>
    const links = [...document.querySelectorAll('.gallery a')];
    const lightbox = document.querySelector('.lightbox');
    const image = lightbox.querySelector('.lightbox-image');
    const count = lightbox.querySelector('.lightbox-count');
    const fadeMs = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 300;

    let current = 0;
    let showRequest = 0;
    let closeTimer;

    // Fade headings in as they scroll into view
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (!entry.isIntersecting) return;
        entry.target.classList.add('is-visible');
        revealObserver.unobserve(entry.target);
      });
    }, { threshold: 0.2, rootMargin: '0px 0px -10% 0px' });

    document.querySelectorAll('.reveal').forEach((heading) => revealObserver.observe(heading));

    // Mobile menu: slides in over the page
    const navMenu = document.querySelector('.nav-menu');
    const navSlideMs = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 450;

    function closeNavMenu() {
      navMenu.classList.remove('is-visible');
      setTimeout(() => navMenu.close(), navSlideMs);
    }

    document.querySelector('.nav-toggle').addEventListener('click', () => {
      navMenu.showModal();
      void navMenu.offsetHeight; // Commit the off-screen state so the slide runs
      navMenu.classList.add('is-visible');
    });

    navMenu.querySelector('.nav-close').addEventListener('click', closeNavMenu);
    navMenu.querySelectorAll('a').forEach((link) => link.addEventListener('click', closeNavMenu));

    // Esc: slide out first instead of closing instantly
    navMenu.addEventListener('cancel', (event) => {
      event.preventDefault();
      closeNavMenu();
    });

    navMenu.addEventListener('close', () => navMenu.classList.remove('is-visible'));

    // Rotating or resizing past the breakpoint leaves no overlay behind
    matchMedia('(max-width: 760px)').addEventListener('change', () => {
      if (navMenu.open) navMenu.close();
    });

    // Show the back-to-top button after scrolling down 400px
    const toTop = document.querySelector('.to-top');
    const updateToTop = () => toTop.classList.toggle('is-visible', window.scrollY > 400);

    window.addEventListener('scroll', updateToTop, { passive: true });
    updateToTop();

    toTop.addEventListener('click', () => {
      const smooth = matchMedia('(prefers-reduced-motion: no-preference)').matches;
      window.scrollTo({ top: 0, behavior: smooth ? 'smooth' : 'auto' });
      document.querySelector('.nav a').focus({ preventScroll: true }); // The button is about to hide
    });

    // Fade thumbnails in as they load
    document.querySelectorAll('.gallery img').forEach((thumb) => {
      if (thumb.complete) return;
      const reveal = () => thumb.classList.remove('is-loading');
      thumb.classList.add('is-loading');
      thumb.addEventListener('load', reveal);
      thumb.addEventListener('error', reveal);
    });

    function showPhoto(index) {
      current = (index + links.length) % links.length;
      const request = ++showRequest;
      image.classList.remove('is-visible');

      setTimeout(() => {
        if (request !== showRequest) return;
        image.src = links[current].href;
        image.alt = links[current].querySelector('img').alt;
        count.textContent = `${current + 1} / ${links.length}`;
      }, fadeMs);

      // Preload the neighbours so browsing feels instant
      [current - 1, current + 1].forEach((neighbour) => {
        new Image().src = links[(neighbour + links.length) % links.length].href;
      });
    }

    function openLightbox(index) {
      clearTimeout(closeTimer);
      lightbox.showModal();
      void lightbox.offsetHeight; // Commit the hidden state so the fade-in runs
      lightbox.classList.add('is-visible');
      showPhoto(index);
    }

    function closeLightbox() {
      lightbox.classList.remove('is-visible');
      closeTimer = setTimeout(() => lightbox.close(), fadeMs);
    }

    links.forEach((link, index) => {
      link.addEventListener('click', (event) => {
        event.preventDefault();
        openLightbox(index);
      });
    });

    image.addEventListener('load', () => image.classList.add('is-visible'));
    image.addEventListener('error', () => image.classList.add('is-visible'));

    lightbox.querySelector('.lightbox-close').addEventListener('click', closeLightbox);
    lightbox.querySelector('.lightbox-prev').addEventListener('click', () => showPhoto(current - 1));
    lightbox.querySelector('.lightbox-next').addEventListener('click', () => showPhoto(current + 1));

    // Clicking the dark area around the photo closes the lightbox
    lightbox.addEventListener('click', (event) => {
      if (event.target === lightbox) closeLightbox();
    });

    lightbox.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowLeft') showPhoto(current - 1);
      if (event.key === 'ArrowRight') showPhoto(current + 1);
    });

    // Esc: fade out first instead of closing instantly
    lightbox.addEventListener('cancel', (event) => {
      event.preventDefault();
      closeLightbox();
    });

    lightbox.addEventListener('close', () => {
      showRequest++;
      lightbox.classList.remove('is-visible');
      image.classList.remove('is-visible');
    });
  </script>
</body>
</html>
